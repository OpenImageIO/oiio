name: CI

on:
  push:
    # Skip jobs when only documentation files are changed
    paths:
      - '**'
      - '!**.md'
      - '!**/*.yml'
      - '**/ci.yml'
      - '**/build-steps.yml'
      - '!**.properties'
      - '!pyproject.toml'
      - '!docs/**'
      - '!src/doc/**'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!**/*.yml'
      - '**/ci.yml'
      - '**/build-steps.yml'
      - '!**.properties'
      - '!pyproject.toml'
      - '!docs/**'
      - '!src/doc/**'
  schedule:
    # Full nightly build
    - cron: "0 8 * * *"
  workflow_dispatch:
    # This allows manual triggering of the workflow from the web

permissions: read-all

# Allow subsequent pushes to the same PR or REF to cancel any previous jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:

  #
  # Linux Tests using ASWF-docker containers
  #
  linux-aswf:
    if: ${{ (github.event.repository.fork == false || github.event_name != 'schedule') && ! contains(github.ref, 'windows-only') && ! contains(github.ref, 'macos-only') && ! contains(github.ref, 'fuzz-only') }}
    name: "${{matrix.desc}}"
    uses: ./.github/workflows/build-steps.yml
    with:
      nametag: ${{ matrix.nametag || 'unnamed!' }}
      runner: ${{ matrix.runner || 'ubuntu-latest' }}
      container: ${{ matrix.container }}
      container_volumes: ${{ matrix.container_volumes || '[]' }}
      cc_compiler: ${{ matrix.cc_compiler }}
      cxx_compiler: ${{ matrix.cxx_compiler }}
      cxx_std: ${{ matrix.cxx_std || '17' }}
      build_type: ${{ matrix.build_type || 'Release' }}
      depcmds: ${{ matrix.depcmds }}
      extra_artifacts: ${{ matrix.extra_artifacts }}
      fmt_ver: ${{ matrix.fmt_ver }}
      fmt_commit: ${{ matrix.fmt_commit }}
      opencolorio_ver: ${{ matrix.opencolorio_ver }}
      openexr_ver: ${{ matrix.openexr_ver }}
      pybind11_ver: ${{ matrix.pybind11_ver }}
      python_ver: ${{ matrix.python_ver }}
      setenvs: ${{ matrix.setenvs }}
      simd: ${{ matrix.simd }}
      skip_build: ${{ matrix.skip_build }}
      skip_tests: ${{ matrix.skip_tests }}
      abi_check: ${{ matrix.abi_check }}
      benchmark: ${{ matrix.benchmark }}
      build_docs: ${{ matrix.build_docs }}
      clang_format: ${{ matrix.clang_format }}
      generator: ${{ matrix.generator }}
      ctest_args: ${{ matrix.ctest_args }}
      ctest_test_timeout: ${{ matrix.ctest_test_timeout }}
      coverage: ${{ matrix.coverage || 0 }}
      sonar: ${{ matrix.sonar || 0 }}
      # Override required_deps to be 'all' and explicitly list as optional
      # only the ones we are intentionally not testing for those jobs.
      required_deps: ${{ matrix.required_deps || 'all' }}
      optional_deps: ${{ matrix.optional_deps || 'DCMTK;FFmpeg;Libheif;Nuke;OpenCV;OpenVDB;Qt5;R3DSDK;'}}${{matrix.optional_deps_append}}
      build_local_deps: ${{ matrix.build_local_deps }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - desc: VFX2023 gcc11/C++17 py3.10 exr3.1 ocio2.3
            nametag: linux-vfx2023
            runner: ubuntu-latest
            container: aswf/ci-osl:2023-clang15.2
            opencolorio_ver: v2.3.0
            python_ver: "3.10"
            oiio_python_bindings_backend: pybind11
            pybind11_ver: v2.10.0
            simd: "avx2,f16c"
            fmt_ver: 10.1.1
            fmt_commit: f5e54359df4c26b6230fc61d38aa294581393084
            setenvs: export PUGIXML_VERSION=v1.13
            optional_deps_append: 'LibRaw;Ptex;Qt6'
          - desc: VFX2024 gcc11/C++17 py3.11 exr3.2 ocio2.3
            nametag: linux-vfx2024
            runner: ubuntu-latest
            container: aswf/ci-oiio:2024.9
            opencolorio_ver: v2.3.2
            python_ver: "3.11"
            oiio_python_bindings_backend: pybind11
            pybind11_ver: v2.12.0
            simd: "avx2,f16c"
            fmt_ver: 10.1.1
            fmt_commit: f5e54359df4c26b6230fc61d38aa294581393084
            setenvs: export PUGIXML_VERSION=v1.14
            optional_deps_append: "LibRaw"
          - desc: VFX2024 clang/C++17 py3.11 exr3.2 ocio2.3
            nametag: linux-vfx2024.clang
            runner: ubuntu-latest
            container: aswf/ci-oiio:2024.9
            cc_compiler: clang
            cxx_compiler: clang++
            opencolorio_ver: v2.3.2
            python_ver: "3.11"
            oiio_python_bindings_backend: pybind11
            pybind11_ver: v2.12.0
            simd: "avx2,f16c"
            fmt_ver: 10.1.1
            fmt_commit: f5e54359df4c26b6230fc61d38aa294581393084
            setenvs: export PUGIXML_VERSION=v1.14
                            OPENJPH_VERSION=0.22.0
            optional_deps_append: "LibRaw"
          - desc: VFX2025 gcc11/C++17 py3.11 exr3.3 ocio2.4
            nametag: linux-vfx2025
            runner: ubuntu-latest
            container: aswf/ci-oiio:2025.8
            cxx_std: 17
            python_ver: "3.11"
            oiio_python_bindings_backend: pybind11
            pybind11_ver: v2.13.6
            simd: "avx2,f16c"
            fmt_ver: 11.2.0
            fmt_commit: 40626af88bd7df9a5fb80be7b25ac85b122d6c21
            benchmark: 1
            setenvs: export PUGIXML_VERSION=v1.15
                            OPENJPH_VERSION=0.24.1
            optional_deps_append: "Qt6"
          - desc: VFX2025 Debug gcc11/C++17 py3.11 exr3.3 ocio2.4
            nametag: linux-vfx2025-debug
            runner: ubuntu-latest
            container: aswf/ci-oiio:2025.8
            cxx_std: 17
            build_type: Debug
            ctest_test_timeout: "300"
            oiio_python_bindings_backend: pybind11
            python_ver: "3.11"
            simd: "avx2,f16c"
            fmt_ver: 11.2.0
            fmt_commit: 40626af88bd7df9a5fb80be7b25ac85b122d6c21
            pybind11_ver: v2.13.6
            setenvs: export PUGIXML_VERSION=v1.15
                            OPENJPH_VERSION=0.24.1
            optional_deps_append: "Qt6"
          # - desc: VFX2025 Static gcc11/C++17 py3.11 exr3.3 ocio2.4
          #   nametag: linux-vfx2025-static
          #   runner: ubuntu-latest
          #   container: aswf/ci-oiio:2025.8
          #   cxx_std: 17
          #   python_ver: "3.11"
          #   simd: "avx2,f16c"
          #   fmt_ver: 11.2.0
          #   pybind11_ver: v2.13.6
          #   benchmark: 1
          #   setenvs: export PUGIXML_VERSION=v1.15
          #                   BUILD_SHARED_LIBS=OFF
          #   optional_deps_append: "Qt6"
          - desc: VFX2025 icx/C++17 py3.11 exr3.3 ocio2.4
            nametag: linux-vfx2025.icx
            runner: ubuntu-latest
            container: aswf/ci-oiio:2025.8
            cc_compiler: icx
            cxx_compiler: icpx
            fmt_ver: 11.2.0
            fmt_commit: 40626af88bd7df9a5fb80be7b25ac85b122d6c21
            python_ver: "3.11"
            oiio_python_bindings_backend: pybind11
            pybind11_ver: v2.13.6
            simd: "avx2,f16c"
            benchmark: 1
            setenvs: export USE_OPENVDB=0 USE_OPENCV=0
                            libuhdr_CMAKE_C_COMPILER=gcc
                            libuhdr_CMAKE_CXX_COMPILER=g++
                            openjph_CMAKE_C_COMPILER=gcc
                            openjph_CMAKE_CXX_COMPILER=g++
                            KTX_CMAKE_C_COMPILER=gcc
                            KTX_CMAKE_CXX_COMPILER=g++
            # Building libuhdr and libktx with icx results in test failures
            optional_deps_append: "LibRaw;Ptex;Qt6"
          - desc: VFX2026 gcc14/C++20 py3.13 exr3.4 ocio2.5
            nametag: linux-vfx2026
            runner: ubuntu-latest
            container: aswf/ci-oiio:2026.6
            cxx_std: 20
            python_ver: "3.13"
            simd: "avx2,f16c"
            pybind11_ver: v3.0.0
            oiio_python_bindings_backend: both
            setenvs: export nanobind_GIT_TAG=v2.13.0
                            nanobind_GIT_COMMIT=e2dc00f7a34f935c6cf91948776d59c4709e9fe6
                            OPENJPH_VERSION=0.30.1
            optional_deps_append: "Qt5;Qt6"
          - desc: VFX2027 gcc14/C++20 py3.13 exr3.4 ocio2.5
            nametag: linux-vfx2027
            runner: ubuntu-latest
            container: aswf/ci-oiio:2027.1
            cxx_std: 20
            python_ver: "3.13"
            oiio_python_bindings_backend: nanobind
            pybind11_ver: v3.0.4
            simd: "avx2,f16c"
            benchmark: 1
          - desc: VFX2027 clang21/C++20 py3.13 exr3.4 ocio2.5
            nametag: linux-vfx2027-clang
            runner: ubuntu-latest
            container: aswf/ci-oiio:2027.1
            cc_compiler: clang
            cxx_compiler: clang++
            cxx_std: 20
            python_ver: "3.13"
            oiio_python_bindings_backend: nanobind
            pybind11_ver: v3.0.4
            simd: "avx2,f16c"
            setenvs: export OPENJPH_VERSION=0.32.0

          - desc: Sanitizers
            nametag: sanitizer
            runner: ubuntu-latest
            container: aswf/ci-oiio:2026.6
            cc_compiler: clang
            cxx_compiler: clang++
            build_type: Debug
            python_ver: "3.13"
            ctest_test_timeout: "1200"
            setenvs: export SANITIZE=address,undefined
                            OIIO_CMAKE_FLAGS="-DSANITIZE=address,undefined -DOIIO_HARDENING=3 -DUSE_PYTHON=0"
                            CTEST_EXCLUSIONS="broken|png-damaged"
                            OpenImageIO_BUILD_LOCAL_DEPS=PNG
            optional_deps_append: "LibRaw"

          # Test ABI stability. `abi_check` is the version or commit that we
          # believe is the current standard against which we don't want to
          # break the ABI. Basically, we will build that version as well as
          # the current one, and compare the resulting libraries.
          - desc: ABI check
            nametag: abi-check
            runner: ubuntu-latest
            container: aswf/ci-oiio:2025.8
            build_type: RelWithDebInfo
            fmt_ver: 11.1.4
            fmt_commit: 123913715afeb8a437e6388b4473fcc4753e1c9a
            python_ver: "3.11"
            pybind11_ver: v3.0.0
            simd: "avx2,f16c"
            skip_tests: 1
            # abi_check: v3.2.0.3
            abi_check: 45414c1aedcd3cc98244b4c5802ec53e91976f70
            setenvs: export OIIO_CMAKE_FLAGS="-DOIIO_BUILD_TOOLS=0 -DOIIO_BUILD_TESTS=0 -DUSE_PYTHON=0"
                            USE_OPENCV=0 USE_FFMPEG=0 USE_PYTHON=0 USE_FREETYPE=0
            optional_deps_append: "Qt6"
          - desc: ABI check 3.2
            nametag: abi-check-3.2
            runner: ubuntu-latest
            container: aswf/ci-oiio:2025.8
            build_type: RelWithDebInfo
            fmt_ver: 11.1.4
            fmt_commit: 123913715afeb8a437e6388b4473fcc4753e1c9a
            python_ver: "3.11"
            pybind11_ver: v3.0.0
            simd: "avx2,f16c"
            skip_tests: 1
            # abi_check: v3.2.0.3
            abi_check: 45414c1aedcd3cc98244b4c5802ec53e91976f70
            setenvs: export OIIO_CMAKE_FLAGS="-DOIIO_BUILD_TOOLS=0 -DOIIO_BUILD_TESTS=0 -DUSE_PYTHON=0"
                            USE_OPENCV=0 USE_FFMPEG=0 USE_PYTHON=0 USE_FREETYPE=0
            optional_deps_append: "Qt6"
          - desc: ABI check 3.1
            nametag: abi-check-3.1
            runner: ubuntu-latest
            container: aswf/ci-oiio:2025.8
            build_type: RelWithDebInfo
            fmt_ver: 11.1.4
            fmt_commit: 123913715afeb8a437e6388b4473fcc4753e1c9a
            python_ver: "3.11"
            pybind11_ver: v3.0.0
            simd: "avx2,f16c"
            skip_tests: 1
            # abi_check: v3.1.17.0 -- make sure we don't break versus 3.1
            abi_check: 73bc189f7d8469a9760ce9c5099b686c77695074
            setenvs: export OIIO_CMAKE_FLAGS="-DOIIO_BUILD_TOOLS=0 -DOIIO_BUILD_TESTS=0 -DUSE_PYTHON=0"
                            USE_OPENCV=0 USE_FFMPEG=0 USE_PYTHON=0 USE_FREETYPE=0
            optional_deps_append: "Qt6"


  #
  # Linux Tests using GHA Ubuntu runners directly
  #
  linux-ubuntu:
    if: ${{ (github.event.repository.fork == false || github.event_name != 'schedule') && ! contains(github.ref, 'windows-only') && ! contains(github.ref, 'macos-only') && ! contains(github.ref, 'fuzz-only') }}
    name: "${{matrix.desc}}"
    uses: ./.github/workflows/build-steps.yml
    with:
      nametag: ${{ matrix.nametag || 'unnamed!' }}
      runner: ${{ matrix.runner || 'ubuntu-latest' }}
      container: ${{ matrix.container }}
      cc_compiler: ${{ matrix.cc_compiler }}
      cxx_compiler: ${{ matrix.cxx_compiler }}
      cxx_std: ${{ matrix.cxx_std || '17' }}
      build_type: ${{ matrix.build_type || 'Release' }}
      depcmds: ${{ matrix.depcmds }}
      extra_artifacts: ${{ matrix.extra_artifacts }}
      fmt_ver: ${{ matrix.fmt_ver }}
      fmt_commit: ${{ matrix.fmt_commit }}
      opencolorio_ver: ${{ matrix.opencolorio_ver }}
      openexr_ver: ${{ matrix.openexr_ver }}
      pybind11_ver: ${{ matrix.pybind11_ver }}
      python_ver: ${{ matrix.python_ver }}
      setenvs: ${{ matrix.setenvs }}
      simd: ${{ matrix.simd }}
      skip_build: ${{ matrix.skip_build }}
      skip_tests: ${{ matrix.skip_tests }}
      abi_check: ${{ matrix.abi_check }}
      benchmark: ${{ matrix.benchmark }}
      build_docs: ${{ matrix.build_docs }}
      clang_format: ${{ matrix.clang_format }}
      generator: ${{ matrix.generator }}
      ctest_args: ${{ matrix.ctest_args }}
      ctest_test_timeout: ${{ matrix.ctest_test_timeout }}
      coverage: ${{ matrix.coverage || 0 }}
      sonar: ${{ matrix.sonar || 0 }}
      gcc_action_ver: ${{ matrix.gcc_action_ver }}
      llvm_action_ver: ${{ matrix.llvm_action_ver }}
      python_action_ver: ${{ matrix.python_action_ver }}
      # Override required_deps to be 'all' and explicitly list as optional
      # only the ones we are intentionally not testing for those jobs.
      required_deps: ${{ matrix.required_deps || 'all' }}
      optional_deps: ${{ matrix.optional_deps || 'CUDAToolkit;DCMTK;Nuke;OpenGL;OpenVDB;Ptex;pystring;Qt5;R3DSDK;Libheif;' }}${{matrix.optional_deps_append}}
      build_local_deps: ${{ matrix.build_local_deps }}
      oiio_python_bindings_backend: ${{ matrix.oiio_python_bindings_backend || 'nanobind' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test formatting. This test entry doesn't build at all, it
          # just runs clang-format on everything, and passes if nothing is
          # misformatted. Upon failure, the build artifact will be the full
          # source code with the formatting fixed (diffs will also appear in
          # the console output).
          - desc: "clang-format"
            nametag: clang-format
            runner: ubuntu-26.04
            cxx_std: 17
            extra_artifacts: "src/*.*"
            python_ver: "3.10"
            pybind11_ver: "0"
            clang_format: 1
            skip_build: 1
            skip_tests: 1
            setenvs: export SKIP_SYSTEM_DEPS_INSTALL=1 SKIP_APT_GET_UPDATE=1
                            INSTALL_OPENCV=0 QT_VERSION=0 USE_LIBHEIF=0
                            CLANG_FORMAT_EXE=clang-format-22
                            EXTRA_DEP_PACKAGES="clang-format-22"

          - desc: latest releases gcc15 C++23 py3.12 avx2 exr3.5 ocio2.6
            nametag: linux-latest-releases
            runner: ubuntu-24.04
            # cc_compiler: gcc-13
            # cxx_compiler: g++-13
            cxx_std: 23
            fmt_ver: 12.2.0
            fmt_commit: 1be298e1bd68957e4cd352e1f676f00e07dcfb57
            opencolorio_ver: v2.6.0
            openexr_ver: v3.5.3
            pybind11_ver: v3.1.0
            python_ver: "3.12"
            oiio_python_bindings_backend: both
            simd: avx2,f16c
            gcc_action_ver: 15
            setenvs: export OIIO_CC=gcc-15 OIIO_CXX=g++-15
                            LIBJPEGTURBO_VERSION=3.2.0
                            LIBPNG_VERSION=v1.6.59
                            LIBRAW_VERSION=0.22.2
                            LIBTIFF_VERSION=v4.7.2
                            OPENJPEG_VERSION=v2.5.4
                            OPENJPH_VERSION=0.33.0
                            PTEX_VERSION=v2.5.4
                            PUGIXML_VERSION=v1.16
                            WEBP_VERSION=v1.6.0
                            FREETYPE_VERSION=VER-2-15-0
                            USE_OPENVDB=0
                            libuhdr_GIT_TAG=v2.0.2
                            libuhdr_GIT_COMMIT=e5f5a022fe96fc4dc2ee35c19f733a50df807abe
                            libuhdr_CMAKE_C_COMPILER=gcc
                            libuhdr_CMAKE_CXX_COMPILER=g++
                            OPENCOLORIO_CXX=c++
                            nanobind_GIT_TAG=v3.1.0
                            nanobind_GIT_COMMIT=68480a9e6883bb1bf65e1925423321e2a89d07f9
            # Ensure we are testing all the deps we think we are. We would
            # like this test to have minimal missing dependencies.
            required_deps: all
            optional_deps: 'CUDAToolkit;DCMTK;Nuke;OpenCV;OpenGL;openjph;OpenVDB;R3DSDK'
          - desc: bleeding edge gcc16 C++26 py3.12 OCIO/libtiff/exr-main avx2
            nametag: linux-bleeding-edge
            runner: ubuntu-24.04
            # cc_compiler: gcc-15
            # cxx_compiler: g++-15
            cxx_std: 26
            fmt_ver: main
            opencolorio_ver: main
            openexr_ver: main
            pybind11_ver: master
            python_ver: "3.12"
            oiio_python_bindings_backend: both
            simd: avx2,f16c
            benchmark: 1
            gcc_action_ver: 16
            setenvs: export OIIO_CC=gcc-16 OIIO_CXX=g++-16
                            LIBJPEGTURBO_VERSION=main
                            LIBPNG_VERSION=master
                            LIBRAW_VERSION=master
                            LIBTIFF_VERSION=master
                            OPENJPEG_VERSION=master
                            OPENJPH_VERSION=master
                            PTEX_VERSION=main
                            PUGIXML_VERSION=master
                            WEBP_VERSION=main
                            OIIO_HARDENING=2
                            EXTRA_DEP_PACKAGES="python3.12-dev python3-numpy"
                            FREETYPE_VERSION=master
                            OpenImageIO_DEPENDENCY_BUILD_ALLOW_UNVERIFIED_TAGS=ON
                            QT_VERSION=0 INSTALL_OPENCV=0 USE_OPENVDB=0
                            libuhdr_GIT_TAG=main
                            libuhdr_DEPENDENCY_BUILD_ALLOW_UNVERIFIED_TAGS=ON
                            libuhdr_CMAKE_C_COMPILER=gcc
                            libuhdr_CMAKE_CXX_COMPILER=g++
                            OPENCOLORIO_CXX=c++
                            nanobind_GIT_TAG=master
                            nanobind_DEPENDENCY_BUILD_ALLOW_UNVERIFIED_TAGS=ON
            # Ensure we are testing all the deps we think we are. We would
            # like this test to have minimal missing dependencies.
            required_deps: all
            optional_deps: 'CUDAToolkit;DCMTK;libuhdr;Nuke;OpenCV;OpenGL;R3DSDK;'
          - desc: all local builds gcc12 C++17 avx2 exr3.5 ocio2.5
            nametag: linux-local-builds
            runner: ubuntu-22.04
            cc_compiler: gcc-12
            cxx_compiler: g++-12
            cxx_std: 17
            fmt_ver: 12.1.0
            fmt_commit: 407c905e45ad75fc29bf0f9bb7c5c2fd3475976f
            python_ver: "3.10"
            oiio_python_bindings_backend: both
            simd: avx2,f16c
            build_local_deps: all
            setenvs: export OpenImageIO_DEPENDENCY_BUILD_VERBOSE=ON
                            LIBRAW_VERSION=0.22.0
                            PTEX_VERSION=v2.4.2
                            PUGIXML_VERSION=v1.14
                            WEBP_VERSION=v1.4.0
                            OIIO_HARDENING=3
          - desc: clang18 C++17 avx2 exr3.1 ocio2.3
            nametag: linux-clang18
            runner: ubuntu-24.04
            cxx_compiler: clang++
            cc_compiler: clang
            cxx_std: 17
            fmt_ver: 10.1.1
            fmt_commit: f5e54359df4c26b6230fc61d38aa294581393084
            opencolorio_ver: v2.3.0
            openexr_ver: v3.1.13
            pybind11_ver: v2.12.0
            python_ver: "3.12"
            simd: avx2,f16c
            setenvs: export USE_OPENVDB=0
                            openjph_CMAKE_C_COMPILER=gcc
                            openjph_CMAKE_CXX_COMPILER=g++
          - desc: Linux ARM latest releases gcc14 C++20 py3.12 exr3.5 ocio2.6
            nametag: linux-arm-latest-releases
            runner: ubuntu-24.04-arm
            cc_compiler: gcc-14
            cxx_compiler: g++-14
            cxx_std: 20
            fmt_ver: 12.2.0
            fmt_commit: 1be298e1bd68957e4cd352e1f676f00e07dcfb57
            opencolorio_ver: v2.6.0
            openexr_ver: v3.5.3
            pybind11_ver: v3.1.0
            python_ver: "3.12"
            oiio_python_bindings_backend: both
            setenvs: export LIBJPEGTURBO_VERSION=3.2.0
                            LIBPNG_VERSION=v1.6.59
                            LIBRAW_VERSION=0.22.2
                            LIBTIFF_VERSION=v4.7.2
                            OPENJPEG_VERSION=v2.5.4
                            OPENJPH_VERSION=0.33.0
                            PTEX_VERSION=v2.5.4
                            PUGIXML_VERSION=v1.16
                            WEBP_VERSION=v1.6.0
                            FREETYPE_VERSION=VER-2-15-0
                            USE_OPENVDB=0
                            nanobind_GIT_TAG=v3.1.0
                            nanobind_GIT_COMMIT=68480a9e6883bb1bf65e1925423321e2a89d07f9
                            libuhdr_GIT_TAG=v2.0.2
                            libuhdr_GIT_COMMIT=e5f5a022fe96fc4dc2ee35c19f733a50df807abe
                            libuhdr_CMAKE_C_COMPILER=gcc
                            libuhdr_CMAKE_CXX_COMPILER=g++
          - desc: Linux ARM latest releases clang18 C++20 py3.12 exr3.5 ocio2.6
            nametag: linux-arm-latest-releases-clang
            runner: ubuntu-24.04-arm
            cc_compiler: clang-18
            cxx_compiler: clang++-18
            cxx_std: 20
            fmt_ver: 12.2.0
            fmt_commit: 1be298e1bd68957e4cd352e1f676f00e07dcfb57
            opencolorio_ver: v2.6.0
            openexr_ver: v3.5.3
            pybind11_ver: v3.1.0
            python_ver: "3.12"
            oiio_python_bindings_backend: both
            setenvs: export LIBJPEGTURBO_VERSION=3.2.0
                            LIBPNG_VERSION=v1.6.59
                            LIBRAW_VERSION=0.22.2
                            LIBTIFF_VERSION=v4.7.2
                            OPENJPEG_VERSION=v2.5.4
                            OPENJPH_VERSION=0.33.0
                            PTEX_VERSION=v2.5.4
                            PUGIXML_VERSION=v1.16
                            WEBP_VERSION=v1.6.0
                            FREETYPE_VERSION=VER-2-15-0
                            USE_OPENVDB=0
                            nanobind_GIT_TAG=v3.1.0
                            nanobind_GIT_COMMIT=68480a9e6883bb1bf65e1925423321e2a89d07f9
                            libuhdr_GIT_TAG=v2.0.2
                            libuhdr_GIT_COMMIT=e5f5a022fe96fc4dc2ee35c19f733a50df807abe
                            libuhdr_CMAKE_C_COMPILER=gcc
                            libuhdr_CMAKE_CXX_COMPILER=g++

          - desc: oldest gcc9/C++17 py3.9 exr3.1 ocio2.3
            # Oldest gcc and versions of the dependencies that we support.
            # Caveats: many optional deps (ffmpeg, TBB, OpenCV, giflib,
            # libheif, OpenJPEG, zlib, ...) are whatever Ubuntu 22.04 ships,
            # not their minimums, and libpng and libjpeg-turbo are not at
            # their minimums.
            nametag: linux-oldest-ubuntu
            runner: ubuntu-22.04
            cc_compiler: gcc-9
            cxx_compiler: g++-9
            cxx_std: 17
            fmt_ver: 9.0.0
            fmt_commit: c4ee726532178e556d923372f29163bd206d7732
            opencolorio_ver: v2.3.0
            openexr_ver: v3.1.0
            pybind11_ver: v2.7.0
            python_ver: "3.9"
            python_action_ver: "3.9"
            oiio_python_bindings_backend: pybind11
            gcc_action_ver: 9
            setenvs: export CMAKE_VERSION=3.23.0
                            PTEX_VERSION=v2.3.2
                            WEBP_VERSION=v1.1.0
                            FREETYPE_VERSION=VER-2-10-0
                            OPENJPH_VERSION=0.21.2
                            PUGIXML_VERSION=v1.11
                            PIP_SUFFIX=.9
                            PIP_INSTALLS=numpy
                            Robinmap_BUILD_VERSION=1.3.0
                            Robinmap_GIT_COMMIT=188c45569cc2a5dd768077c193830b51d33a5020
                            TIFF_BUILD_VERSION=4.1.0
                            TIFF_GIT_COMMIT=e0d707dc1524d8c0e20f03396f234e0f1b07b3f4
                            LIBRAW_VERSION=0.21.0
                            libuhdr_BUILD_VERSION=1.3.0
                            libuhdr_GIT_TAG=v1.3.0
                            libuhdr_GIT_COMMIT=2222dad8f259fbadd08a481953f1791cbc8f975d
                            libuhdr_CMAKE_C_COMPILER=gcc
                            libuhdr_CMAKE_CXX_COMPILER=g++
                            ENABLE_KTX=0
                            #  OpenJPEG_BUILD_VERSION=2.2.0
                            #  OpenJPEG_GIT_COMMIT=3d7cde5fc9fbc5618d02160900d32e02ed12a00e
            # libktx > 4.3.2 requires CMake >= 3.22
            optional_deps_append: 'FFmpeg;LibRaw;Ptex;Qt6'
            build_local_deps: 'TIFF'
          - desc: oldest clang11/C++17 py3.9 exr3.1 ocio2.3
            # Oldest clang and versions of the dependencies that we support.
            # Caveats: many optional deps (ffmpeg, TBB, OpenCV, giflib,
            # libheif, OpenJPEG, zlib, ...) are whatever Ubuntu 22.04 ships,
            # not their minimums, and libpng and libjpeg-turbo are not at
            # their minimums.
            # Deliberately sets no `simd`, so that this job exercises the
            # default SIMD level for x86_64 (x86-64-v2). Please leave it unset.
            nametag: linux-oldest-clang-ubuntu
            runner: ubuntu-22.04
            cxx_std: 17
            fmt_ver: 9.0.0
            fmt_commit: c4ee726532178e556d923372f29163bd206d7732
            opencolorio_ver: v2.3.0
            openexr_ver: v3.1.0
            pybind11_ver: v2.7.0
            python_ver: "3.9"
            python_action_ver: "3.9"
            oiio_python_bindings_backend: both
            llvm_action_ver: "11"
            setenvs: export CMAKE_VERSION=3.23.0
                            PTEX_VERSION=v2.3.2
                            WEBP_VERSION=v1.1.0
                            FREETYPE_VERSION=VER-2-10-0
                            PUGIXML_VERSION=v1.11
                            PIP_SUFFIX=.9
                            PIP_INSTALLS=numpy
                            OIIO_CC=clang
                            OIIO_CXX=clang++
                            Robinmap_BUILD_VERSION=1.3.0
                            Robinmap_GIT_COMMIT=188c45569cc2a5dd768077c193830b51d33a5020
                            TIFF_BUILD_VERSION=4.1.0
                            TIFF_GIT_COMMIT=e0d707dc1524d8c0e20f03396f234e0f1b07b3f4
                            OPENJPH_VERSION=0.21.2
                            LIBRAW_VERSION=0.21.0
                            nanobind_GIT_TAG=v2.8.0
                            nanobind_GIT_COMMIT=0e7aa61a75052034453cd2b906a79fe222792697
                            ENABLE_KTX=0
                            libuhdr_BUILD_VERSION=1.3.0
                            libuhdr_GIT_TAG=v1.3.0
                            libuhdr_GIT_COMMIT=2222dad8f259fbadd08a481953f1791cbc8f975d
                            libuhdr_CMAKE_C_COMPILER=gcc
                            libuhdr_CMAKE_CXX_COMPILER=g++
                            #  OpenJPEG_BUILD_VERSION=2.2.0
                            #  OpenJPEG_GIT_COMMIT=3d7cde5fc9fbc5618d02160900d32e02ed12a00e
            # libktx > 4.3.2 requires CMake >= 3.22
            optional_deps_append: 'FFmpeg;LibRaw;Ptex;Qt6'
            build_local_deps: 'TIFF'

          - desc: hobbled gcc9/C++17 py3.9 exr-3.1 no-sse
            # Use the oldest supported versions of most required dependencies
            # (but not libpng, which is the system 1.6.37), and disable
            # most optional dependencies and features (no SSE, OpenCV, or
            # libjpeg-turbo, so it uses the system libjpeg; don't embed
            # plugins).
            nametag: linux-hobbled-ubuntu
            runner: ubuntu-22.04
            cc_compiler: gcc-9
            cxx_compiler: g++-9
            cxx_std: 17
            fmt_ver: 9.0.0
            fmt_commit: c4ee726532178e556d923372f29163bd206d7732
            opencolorio_ver: v2.3.0
            openexr_ver: v3.1.0
            pybind11_ver: v2.7.0
            python_ver: "3.9"
            python_action_ver: "3.9"
            oiio_python_bindings_backend: pybind11
            gcc_action_ver: 9
            simd: 0
            setenvs: export  EMBEDPLUGINS=0
                             CMAKE_VERSION=3.23.0
                             PTEX_VERSION=v2.3.2
                             WEBP_VERSION=v1.1.0
                             OIIO_CMAKE_FLAGS="-DUSE_libjpeg-turbo=0"
                             USE_OPENCV=0
                             USE_LIBUHDR=0
                             FREETYPE_VERSION=VER-2-10-0
                             PUGIXML_VERSION=v1.11
                             PIP_SUFFIX=.9
                             PIP_INSTALLS=numpy
                             Robinmap_BUILD_VERSION=1.3.0
                             Robinmap_GIT_COMMIT=188c45569cc2a5dd768077c193830b51d33a5020
                             TIFF_BUILD_VERSION=4.1.0
                             TIFF_GIT_COMMIT=e0d707dc1524d8c0e20f03396f234e0f1b07b3f4
                             ENABLE_KTX=0
                             # libktx > 4.3.2 requires CMake >= 3.22
            required_deps: none
            build_local_deps: 'TIFF'


  #
  # MacOS Tests
  #
  macos:
    if: ${{ (github.event.repository.fork == false || github.event_name != 'schedule') && ! contains(github.ref, 'windows-only') && ! contains(github.ref, 'linux-only') && ! contains(github.ref, 'fuzz-only') }}
    name: "${{matrix.desc}}"
    uses: ./.github/workflows/build-steps.yml
    with:
      nametag: ${{ matrix.nametag || 'unnamed!' }}
      runner: ${{ matrix.runner || 'ubuntu-latest' }}
      container: ${{ matrix.container }}
      cc_compiler: ${{ matrix.cc_compiler || 'clang' }}
      cxx_compiler: ${{ matrix.cxx_compiler || 'clang++' }}
      cxx_std: ${{ matrix.cxx_std || '17' }}
      build_type: ${{ matrix.build_type || 'Release' }}
      depcmds: ${{ matrix.depcmds }}
      extra_artifacts: ${{ matrix.extra_artifacts }}
      fmt_ver: ${{ matrix.fmt_ver }}
      fmt_commit: ${{ matrix.fmt_commit }}
      opencolorio_ver: ${{ matrix.opencolorio_ver }}
      openexr_ver: ${{ matrix.openexr_ver }}
      pybind11_ver: ${{ matrix.pybind11_ver }}
      python_ver: ${{ matrix.python_ver }}
      setenvs: ${{ matrix.setenvs }}
      simd: ${{ matrix.simd }}
      skip_build: ${{ matrix.skip_build }}
      skip_tests: ${{ matrix.skip_tests }}
      benchmark: ${{ matrix.benchmark }}
      abi_check: ${{ matrix.abi_check }}
      build_docs: ${{ matrix.build_docs }}
      generator: ${{ matrix.generator }}
      ctest_args: ${{ matrix.ctest_args }}
      ctest_test_timeout: ${{ matrix.ctest_test_timeout || '800' }}
      coverage: ${{ matrix.coverage || 0 }}
      sonar: ${{ matrix.sonar || 0 }}
      # We're able to use Homebrew to install ALMOST every dependency, so the
      # only optional ones in our Mac CI tests are commercial things we can't
      # test in GHA CI.
      required_deps: ${{ matrix.required_deps || 'all' }}
      optional_deps: ${{ matrix.optional_deps || 'Nuke;R3DSDK;' }}${{matrix.optional_deps_append}}
      build_local_deps: ${{ matrix.build_local_deps }}
      oiio_python_bindings_backend: ${{ matrix.oiio_python_bindings_backend || 'nanobind' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - desc: MacOS-15-Intel aclang17/C++17/py3.14
            runner: macos-15-intel
            nametag: MacOS-15-Intel
            cc_compiler: /usr/bin/clang
            cxx_compiler: /usr/bin/clang++
            cxx_std: 17
            python_ver: "3.14"
            oiio_python_bindings_backend: both
            simd: sse4.2,avx2
            ctest_test_timeout: 1200
            setenvs: export MACOSX_DEPLOYMENT_TARGET=12.0
                            INSTALL_QT=0 INSTALL_OPENCV=0 INSTALL_OPENVDB=0
                            Ktx_ASTCENC_ISA=ASTCENC_ISA_SSE41
            # Intel-based MacOS runners don't support AVX2 SIMD which is the
            # default set by libktx. Explicitly set to SSE4.1 (2nd fastest after AVX2)
            optional_deps_append: 'OpenCV;OpenVDB;Qt5;Qt6'
            benchmark: 1
          - desc: MacOS-15-ARM aclang17/C++20/py3.13
            runner: macos-15
            nametag: macos15-arm-py313
            cc_compiler: /usr/bin/clang
            cxx_compiler: /usr/bin/clang++
            cxx_std: 20
            python_ver: "3.13"
            oiio_python_bindings_backend: nanobind
            benchmark: 1
          - desc: MacOS-26-ARM aclang21/C++20/py3.14
            runner: macos-26
            nametag: macos26-arm-py314
            cc_compiler: /usr/bin/clang
            cxx_compiler: /usr/bin/clang++
            cxx_std: 20
            python_ver: "3.14"
            oiio_python_bindings_backend: nanobind
            benchmark: 1


  #
  # Windows Tests
  #
  windows:
    if: ${{ (github.event.repository.fork == false || github.event_name != 'schedule') && ! contains(github.ref, 'linux-only') && ! contains(github.ref, 'macos-only') && ! contains(github.ref, 'fuzz-only') }}
    name: "${{matrix.desc}}"
    uses: ./.github/workflows/build-steps.yml
    with:
      nametag: ${{ matrix.nametag || 'unnamed!' }}
      runner: ${{ matrix.runner || 'ubuntu-latest' }}
      container: ${{ matrix.container }}
      cc_compiler: ${{ matrix.cc_compiler }}
      cxx_compiler: ${{ matrix.cxx_compiler }}
      cxx_std: ${{ matrix.cxx_std || '17' }}
      build_type: ${{ matrix.build_type || 'Release' }}
      depcmds: ${{ matrix.depcmds }}
      extra_artifacts: ${{ matrix.extra_artifacts }}
      fmt_ver: ${{ matrix.fmt_ver }}
      fmt_commit: ${{ matrix.fmt_commit }}
      opencolorio_ver: ${{ matrix.opencolorio_ver }}
      openexr_ver: ${{ matrix.openexr_ver }}
      pybind11_ver: ${{ matrix.pybind11_ver }}
      python_ver: ${{ matrix.python_ver }}
      setenvs: ${{ matrix.setenvs }}
      simd: ${{ matrix.simd }}
      skip_build: ${{ matrix.skip_build }}
      skip_tests: ${{ matrix.skip_tests }}
      benchmark: ${{ matrix.benchmark }}
      abi_check: ${{ matrix.abi_check }}
      build_docs: ${{ matrix.build_docs }}
      generator: ${{ matrix.generator }}
      ctest_args: ${{ matrix.ctest_args }}
      ctest_test_timeout: ${{ matrix.ctest_test_timeout }}
      coverage: ${{ matrix.coverage || 0 }}
      sonar: ${{ matrix.sonar || 0 }}
      # Windows is a PITA, so we expect very few dependencies to be present or
      # built. But we would like to add more dependencies and reduce this list
      # of exceptions in the future.
      required_deps: ${{ matrix.required_deps || 'all' }}
      optional_deps: ${{ matrix.optional_deps || 'BZip2;CUDAToolkit;DCMTK;FFmpeg;GIF;Libheif;LibRaw;Nuke;OpenCV;OpenGL;OpenJPEG;OpenCV;OpenVDB;Ptex;pystring;Qt5;Qt6;TBB;R3DSDK;${{matrix.optional_deps_append}}' }}
      build_local_deps: ${{ matrix.build_local_deps }}
      oiio_python_bindings_backend: ${{ matrix.oiio_python_bindings_backend || 'nanobind' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - desc: Windows-2022 VS2022
            runner: windows-2022
            nametag: windows-2022
            generator: "Visual Studio 17 2022"
            python_ver: "3.12"
            oiio_python_bindings_backend: both
            ctest_test_timeout: "240"
            setenvs: export OPENIMAGEIO_PYTHON_LOAD_DLLS_FROM_PATH=1
          - desc: Windows-2025 VS2026
            runner: windows-2025-vs2026
            nametag: windows-2025-vs2026
            generator: "Visual Studio 18 2026"
            python_ver: "3.12"
            oiio_python_bindings_backend: nanobind
            ctest_test_timeout: "240"
            setenvs: export OPENIMAGEIO_PYTHON_LOAD_DLLS_FROM_PATH=1
            benchmark: 1
